[project]
name = "ai-pr-reviewer"
version = "1.0.0"
description = "Multi-agent AI pull request reviewer built on Google ADK"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Zumry Wahid", email = "zumrywahid@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.8.0",
    "requests>=2.31",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
